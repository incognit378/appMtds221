<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/login"></ion-back-button>
    </ion-buttons>
    <ion-title>Recuperar Acceso</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <!-- Paso 1: Solicitar código -->
  <ion-card *ngIf="!codigoEnviado">
    <ion-card-header>
      <ion-card-title>Restablecer Contraseña</ion-card-title>
      <ion-card-subtitle>Ingresa tu correo institucional para recibir un código</ion-card-subtitle>
    </ion-card-header>
    <ion-card-content>
      <ion-item fill="outline" class="ion-margin-bottom">
        <ion-label position="floating">Correo Institucional</ion-label>
        <ion-input type="email" [(ngModel)]="email"></ion-input>
      </ion-item>

      <ion-button expand="block" (click)="enviarCodigo()" [disabled]="!email || cargando">
        Enviar Código
      </ion-button>
    </ion-card-content>
  </ion-card>

  <!-- Paso 2: Ingresar código y nueva contraseña -->
  <ion-card *ngIf="codigoEnviado">
    <ion-card-header>
      <ion-card-title>Nueva Contraseña</ion-card-title>
      <ion-card-subtitle>Código de prueba generado: <strong>{{ codigoDemo }}</strong></ion-card-subtitle>
    </ion-card-header>
    <ion-card-content>
      <ion-item fill="outline" class="ion-margin-bottom">
        <ion-label position="floating">Código de 6 dígitos</ion-label>
        <ion-input type="text" [(ngModel)]="codigo"></ion-input>
      </ion-item>

      <ion-item fill="outline" class="ion-margin-bottom">
        <ion-label position="floating">Nueva Contraseña (mín. 6 caracteres)</ion-label>
        <ion-input type="password" [(ngModel)]="nuevaPassword"></ion-input>
      </ion-item>

      <ion-button expand="block" color="success" (click)="cambiarPassword()" [disabled]="!codigo || nuevaPassword.length < 6 || cargando">
        Guardar Nueva Contraseña
      </ion-button>
    </ion-card-content>
  </ion-card>
</ion-content>
