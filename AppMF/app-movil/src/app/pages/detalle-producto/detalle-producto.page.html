<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/tab1"></ion-back-button>
    </ion-buttons>
    <ion-title>Ficha Técnica</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div *ngIf="cargando" class="ion-text-center ion-padding">
    <ion-spinner name="crescent"></ion-spinner>
  </div>

  <ion-card *ngIf="producto && !cargando">
    <img [src]="producto.imagen" [alt]="producto.nombre" style="width: 100%; height: 220px; object-fit: cover;" />
    <ion-card-header>
      <ion-badge color="secondary" class="ion-margin-bottom" style="width: fit-content;">
        {{ producto.categoria }}
      </ion-badge>
      <ion-card-title>{{ producto.nombre }}</ion-card-title>
      <ion-card-subtitle color="primary" style="font-size: 1.3rem; font-weight: bold;">
        ${{ producto.precio }} USD
      </ion-card-subtitle>
    </ion-card-header>

    <ion-card-content>
      <p class="ion-margin-bottom">{{ producto.descripcion }}</p>
      <ion-chip color="success">
        <ion-label>Disponibilidad: {{ producto.stock }} unidades</ion-label>
      </ion-chip>

      <ion-button expand="block" color="primary" class="ion-margin-top" (click)="agregarASolicitud()">
        <ion-icon name="cart-outline" slot="start"></ion-icon>
        Agregar a Lista de Solicitudes
      </ion-button>
    </ion-card-content>
  </ion-card>
</ion-content>
